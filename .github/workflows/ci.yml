name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:app
      - run: pnpm test:frontend
      - run: pnpm test:linux
      - run: pnpm linux:prepare

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha-version: ['2026.9.4', '2026.10.1', '2026.10.2']
    steps:
      - uses: actions/checkout@v4
      - name: Test integration against Home Assistant Core ${{ matrix.ha-version }}
        run: docker run --rm --entrypoint python -v "$PWD:/work:ro" -w /work ghcr.io/home-assistant/home-assistant:${{ matrix.ha-version }} scripts/test-atlas-frontend.py
