<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ATLAS Status Surface</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 560px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 20px;
        color: #536079;
      }

      .status-controls {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .status-controls button {
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #ffffff;
        color: #172033;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }

      .status-controls button[aria-pressed="true"] {
        border-color: #0f766e;
        background: #e6fffb;
        color: #115e59;
      }

      .connection-config {
        display: grid;
        gap: 6px;
        margin: 0 0 16px;
      }

      .connection-config label {
        font-size: 14px;
        font-weight: 700;
      }

      .connection-config input,
      .connection-config select {
        width: 100%;
        min-height: 40px;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #ffffff;
        color: #172033;
        padding: 8px 10px;
        font: inherit;
      }

      .connection-config .remember-secret {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        font-weight: 500;
        color: #536079;
      }

      .connection-config .remember-secret input {
        width: 16px;
        min-height: 16px;
        margin: 0;
        accent-color: #0f766e;
      }

      .connection-config input:focus,
      .connection-config select:focus {
        outline: 2px solid #0f766e;
        outline-offset: 1px;
      }

      .entity-domain-shortcuts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 32px;
      }

      .entity-domain-shortcuts button {
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #ffffff;
        color: #172033;
        padding: 6px 9px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .entity-domain-shortcuts button[aria-pressed="true"] {
        border-color: #0f766e;
        background: #e6fffb;
        color: #0f766e;
        font-weight: 700;
      }

      .entity-domain-shortcuts button:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 1px;
      }

      .entity-search-control {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 34px;
        gap: 6px;
        align-items: stretch;
      }

      .entity-search-control input {
        min-width: 0;
      }

      .entity-search-control button {
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #ffffff;
        color: #536079;
        min-height: 34px;
        padding: 0;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .entity-search-control button:hover:not(:disabled),
      .entity-search-control button:focus-visible {
        border-color: #0f766e;
        color: #0f766e;
        outline: 2px solid #0f766e;
        outline-offset: 1px;
      }

      .entity-search-control button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .entity-picker-status {
        min-height: 20px;
        color: #536079;
        font-size: 13px;
      }

      .empty-selection-state {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        min-height: 104px;
        border: 1px dashed #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        color: #536079;
        font-weight: 700;
        text-align: center;
        padding: 20px;
      }

      .connection-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .connection-actions button {
        border: 1px solid #0f766e;
        border-radius: 4px;
        background: #0f766e;
        color: #ffffff;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }

      .connection-actions button:last-child {
        border-color: #cbd5e1;
        background: #ffffff;
        color: #172033;
      }

      .connection-actions .import-button {
        display: inline-flex;
        align-items: center;
        border: 1px solid #0f766e;
        border-radius: 4px;
        background: #0f766e;
        color: #ffffff;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }

      .connection-actions .import-button:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 1px;
      }

      .connection-actions button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      @media (max-width: 480px) {
        .connection-actions button,
        .connection-actions .import-button {
          flex: 1 1 140px;
        }
      }

      #connection-readiness {
        min-height: 20px;
        color: #536079;
        font-size: 14px;
      }

      #connection-state[data-state="failed"] {
        color: #b91c1c;
      }

      #connection-state[data-state="connected"] {
        color: #0f766e;
      }

      #selected-entity {
        min-height: 20px;
        color: #536079;
        font-size: 14px;
      }

      #ha-card-dependency {
        min-height: 20px;
        color: #536079;
        font-size: 14px;
      }

      #ha-card-dependency[data-required="true"] {
        color: #a16207;
      }

      #ha-card-dependency[data-status="installed"] {
        color: #0f766e;
      }

      #ha-card-dependency[data-status="missing"] {
        color: #b91c1c;
      }

      #ha-card-dependency[data-status="unchecked"] {
        color: #a16207;
      }

      .ha-card-preview {
        display: grid;
        gap: 6px;
        margin: 4px 0 0;
      }

      .ha-card-preview pre {
        min-height: 148px;
        max-height: 240px;
        overflow: auto;
        box-sizing: border-box;
        margin: 0;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #172033;
        color: #eef6ff;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      #atlas-entity-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 8px;
        margin: 16px 0;
      }

      .atlas-entity-card {
        display: grid;
        gap: 4px;
        min-height: 76px;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        cursor: pointer;
      }

      .atlas-entity-card:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 2px;
      }

      .atlas-entity-card[data-primary="true"] {
        border-color: #0f766e;
        background: #ecfdf5;
      }

      .atlas-entity-card[data-stack-selected="true"] {
        box-shadow: inset 0 0 0 1px #0f766e;
      }

      .entity-section-title {
        margin: 18px 0 4px;
        font-size: 16px;
        letter-spacing: 0;
      }

      #stack-selection-summary {
        min-height: 20px;
        color: #536079;
        font-size: 14px;
      }

      .atlas-entity-card strong {
        overflow-wrap: anywhere;
      }

      .atlas-entity-card span {
        color: #0f766e;
        font-weight: 700;
      }

      .atlas-entity-card small {
        color: #536079;
      }

      .atlas-entity-card[data-category="temperature"] { border-left: 4px solid #dc2626; }
      .atlas-entity-card[data-category="power"] { border-left: 4px solid #d97706; }
      .atlas-entity-card[data-category="battery"] { border-left: 4px solid #65a30d; }
      .atlas-entity-card[data-category="light"] { border-left: 4px solid #ca8a04; }
      .atlas-entity-card[data-category="switch"] { border-left: 4px solid #0f766e; }
      .atlas-entity-card[data-battery-level="low"] { border-color: #dc2626; background: #fff7f7; }
      .atlas-entity-card[data-battery-level="medium"] { border-color: #d97706; background: #fffaf0; }

      .atlas-entity-card button {
        justify-self: start;
        border: 1px solid #0f766e;
        border-radius: 4px;
        background: #ffffff;
        color: #115e59;
        padding: 6px 8px;
        font: inherit;
        cursor: pointer;
      }

      .atlas-entity-card-actions {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
      }

      .atlas-entity-card .icon-button {
        width: 30px;
        min-width: 30px;
        min-height: 30px;
        display: inline-grid;
        place-items: center;
        border-color: #cbd5e1;
        padding: 0;
        line-height: 1;
      }

      .atlas-entity-card .icon-button:last-child {
        color: #b91c1c;
      }

      .atlas-entity-card .stack-checkbox {
        width: 30px;
        min-width: 30px;
        min-height: 30px;
        margin: 0;
        accent-color: #0f766e;
      }

      #atlas-status-root {
        min-height: 104px;
      }

      .atlas-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        box-sizing: border-box;
        min-height: 104px;
        padding: var(--atlas-spacing);
        border: 1px solid color-mix(in srgb, var(--atlas-color-accent) 45%, #cbd5e1);
        border-radius: 6px;
        background: var(--atlas-color-surface);
        color: var(--atlas-color-text);
        font-family: var(--atlas-font-family);
      }

      .atlas-status strong {
        font-size: 18px;
        letter-spacing: 0;
      }

      .atlas-status span {
        color: var(--atlas-color-accent);
        font-weight: 700;
      }

      .atlas-status[data-status="blocked"] {
        border-color: #dc2626;
      }

      .atlas-status[data-status="blocked"] span {
        color: #b91c1c;
      }

      .atlas-status[data-status="pending"] span {
        color: #a16207;
      }

      #status-message {
        min-height: 24px;
        margin-top: 12px;
        color: #536079;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@atlas/core": "/packages/core/dist/index.js",
          "@atlas/renderer": "/packages/renderer/dist/index.js",
          "@atlas/theme": "/packages/theme/dist/index.js",
          "@atlas/homeassistant": "/packages/homeassistant/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>ATLAS Status Surface</h1>
      <p>Renderer, Theme and a simulated Home Assistant entity running together.</p>
      <div class="status-controls" role="group" aria-label="Entity state">
        <button type="button" data-entity-state="off" aria-pressed="false">Off</button>
        <button type="button" data-entity-state="on" aria-pressed="true">On</button>
        <button type="button" data-entity-state="unavailable" aria-pressed="false">Unavailable</button>
      </div>
      <div class="connection-config">
        <label for="home-assistant-url">Home Assistant URL</label>
        <input id="home-assistant-url" type="url" inputmode="url" value="http://homeassistant.local:8123" autocomplete="url">
        <label for="home-assistant-token">Access token</label>
        <input id="home-assistant-token" type="password" autocomplete="off" spellcheck="false">
        <label class="remember-secret" for="remember-home-assistant-token">
          <input id="remember-home-assistant-token" type="checkbox">
          Remember token locally
        </label>
        <div class="connection-actions">
          <button id="connect-home-assistant" type="button">Connect</button>
          <button id="disconnect-home-assistant" type="button" disabled>Disconnect</button>
        </div>
        <output id="connection-readiness" aria-live="polite"></output>
        <output id="connection-state" data-state="closed" aria-live="polite">Connection: closed</output>
      </div>
      <div class="connection-config">
        <label for="home-assistant-group">Panel group</label>
        <select id="home-assistant-group">
          <option value="overview">Overview</option>
          <option value="energy">Energy</option>
          <option value="safety">Safety</option>
          <option value="custom">Custom</option>
        </select>
        <label for="home-assistant-group-name">Group name</label>
        <input id="home-assistant-group-name" type="text" autocomplete="off">
        <label for="ha-card-target">Card target</label>
        <select id="ha-card-target"></select>
        <label for="ha-card-layout">Card layout</label>
        <select id="ha-card-layout">
          <option value="single">Simple</option>
          <option value="horizontal-stack">Horizontal stack</option>
          <option value="vertical-stack">Vertical stack</option>
        </select>
        <label for="ha-card-format">Card format</label>
        <select id="ha-card-format">
          <option value="json">JSON</option>
          <option value="yaml">YAML</option>
        </select>
        <output id="ha-card-dependency" aria-live="polite"></output>
        <div class="connection-actions">
          <button id="save-home-assistant-group" type="button">Save group</button>
          <button id="delete-home-assistant-group" type="button">Delete group</button>
          <button id="duplicate-home-assistant-group" type="button">Duplicate group</button>
          <button id="export-home-assistant-config" type="button">Export</button>
          <button id="export-ha-card-config" type="button">Export HA card</button>
          <button id="export-ha-card-package" type="button">Export card package</button>
          <button id="copy-ha-card-config" type="button">Copy HA card</button>
          <button id="copy-ha-card-resources" type="button" disabled>Copy resources</button>
          <button id="check-ha-card-resources" type="button" disabled>Check resources</button>
          <label class="import-button" for="import-home-assistant-config">Import</label>
          <input id="import-home-assistant-config" type="file" accept="application/json" hidden>
          <label class="import-button" for="import-ha-card-config">Import HA card</label>
          <input id="import-ha-card-config" type="file" accept="application/json,.json,.yaml,.yml" hidden>
        </div>
        <label for="home-assistant-entity">Entity IDs</label>
        <input id="home-assistant-entity" type="text" value="binary_sensor.atlas_status, sensor.atlas_temperature" autocomplete="off" spellcheck="false">
        <label for="home-assistant-entity-domain">Entity type</label>
        <select id="home-assistant-entity-domain"></select>
        <div id="home-assistant-entity-domain-shortcuts" class="entity-domain-shortcuts" aria-label="Entity type shortcuts"></div>
        <label for="home-assistant-entity-search">Entity search</label>
        <div class="entity-search-control">
          <input id="home-assistant-entity-search" type="search" autocomplete="off" spellcheck="false" placeholder="Filter by name or entity ID">
          <button id="clear-home-assistant-entity-search" type="button" aria-label="Clear entity search" title="Clear entity search" disabled>&times;</button>
        </div>
        <label for="home-assistant-entity-picker">Entity picker</label>
        <select id="home-assistant-entity-picker"></select>
        <output id="home-assistant-entity-picker-status" class="entity-picker-status" aria-live="polite"></output>
        <div class="connection-actions">
          <button id="add-home-assistant-entity" type="button">Add entity</button>
          <button id="refresh-home-assistant-entities" type="button">Refresh entities</button>
        </div>
        <output id="selected-entity" aria-live="polite"></output>
        <div class="ha-card-preview">
          <label for="ha-card-preview">HA card code</label>
          <pre id="ha-card-preview" aria-live="polite"></pre>
        </div>
      </div>
      <h2 class="entity-section-title">ATLAS Status Preview</h2>
      <div id="atlas-status-root" aria-live="polite"></div>
      <h2 class="entity-section-title">Ausgewählte Entitäten</h2>
      <output id="stack-selection-summary" aria-live="polite"></output>
      <output id="group-summary" aria-live="polite"></output>
      <output id="group-issues" aria-live="polite"></output>
      <div id="atlas-entity-list" aria-live="polite"></div>
      <div id="status-message" role="status"></div>
    </main>
    <script type="module" src="/examples/status-demo/app.js"></script>
  </body>
</html>
