services:
  atlas:
    build:
      context: .
    image: atlas:local
    environment:
      ATLAS_HOST: 0.0.0.0
      ATLAS_APP_HOST: 0.0.0.0
      ATLAS_APP_PORT: 4176
      ATLAS_ADMIN_PORT: 4175
      ATLAS_DEMO_PORT: 4174
      ATLAS_DISTRIBUTION_TARGET: standalone-docker-preview
      ATLAS_INSTANCE_ID: ${ATLAS_INSTANCE_ID:-atlas-local}
      ATLAS_TERMINAL_ENABLED: ${ATLAS_TERMINAL_ENABLED:-0}
      ATLAS_TERMINAL_TOKEN: ${ATLAS_TERMINAL_TOKEN:-}
      ATLAS_TERMINAL_SSH_HOST: ${ATLAS_TERMINAL_SSH_HOST:-}
      ATLAS_TERMINAL_SSH_USER: ${ATLAS_TERMINAL_SSH_USER:-}
      ATLAS_TERMINAL_SSH_PORT: ${ATLAS_TERMINAL_SSH_PORT:-22}
      ATLAS_TERMINAL_SSH_IDENTITY_FILE: ${ATLAS_TERMINAL_SSH_IDENTITY_FILE:-}
      ATLAS_TERMINAL_SSH_KNOWN_HOSTS: ${ATLAS_TERMINAL_SSH_KNOWN_HOSTS:-}
    ports:
      - "4176:4176"
      - "4175:4175"
      - "4174:4174"
    restart: unless-stopped
